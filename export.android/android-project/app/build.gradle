plugins {
	id 'com.android.application'
}

android {
	namespace "lowresrmx.author_name.game_name"
	compileSdk 34

	defaultConfig {
		applicationId 'lowresrmx.author_name.game_name'
		minSdkVersion 21
		targetSdkVersion 33
		versionCode 1
		versionName '1.0'

		externalNativeBuild {
			cmake {
				arguments '-DANDROID_STL=c++_shared', '-DWITH_IMAGE=OFF', '-DWITH_MIXER=OFF', '-DWITH_NET=OFF', '-DWITH_BOX2D=OFF'
				abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
			}
		}
	}

	externalNativeBuild {
		cmake {
			path 'c/CMakeLists.txt'
		}
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
		customeDebugType {
			debuggable true
		}
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_1_8
		targetCompatibility JavaVersion.VERSION_1_8
	}
	buildFeatures {
		prefab true
	}
	ndkVersion '28.2.13676358'
}

dependencies {
	implementation files('libs/SDL3-3.4.4.aar')
	implementation 'androidx.appcompat:appcompat:1.7.1'
}
