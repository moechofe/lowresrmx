<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="pico.min.css">
<link rel="stylesheet" href="publish.css">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<script src="publish.js"></script>
</head>
<body>
<main class="container">
<article>
</article>
</main>
<template id="create-replace">
	<fieldset class="create-replace grid">
		<button class="create outline">Create a new post</button>
		<button class="replace outline">Replace an old post</button>
	</fieldset>
</template>
<template id="create">
	<fieldset class="create">
		<select class="where" required>
			<option selected disabled value="">
				Where to post&hellip;
			</option>
			<option value="show">Showcase / Work in progress</option>
			<option value="chat">Chat / News / Blog / Unrelated</option>
			<option value="help">Help / Example / Documentation</option>
		</select>
	</fieldset>
</template>
<template id="replace">
	<fieldset class="replace">
		<input class="own-choice" list="own-list" placeholder="Select an existing post" aria-label="Search" />
		<datalist id="own-list"></datalist>
	</fieldset>
</template>
<template id="content">
	<fieldset class="content">
		<input type="text" class="title" required placeholder="Program title" />
		<div class="limit" data-limit="<?=MAX_POST_TEXT?>"></div>
		<textarea class="text" placeholder="Message&hellip;" aria-busy="true"></textarea>
	</fieldset>
</template>
<template id="button">
	<fieldset class="button grid">
		<button class="publish">Publish</button>
		<button class="cancel outline">Cancel</button>
	</fieldset>
</template>
<template id="own-item">
	<option class="own-item"></option>
</template>
</body>
</html>
