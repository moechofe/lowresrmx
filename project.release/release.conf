# Release publishing configuration. Sourced by the scripts in this folder.
# Nothing here is secret: the only secret is the GitHub secret BUTLER_API_KEY.

# itch.io publishing target: the "user/game" part of the page URL
# (https://<user>.itch.io/<game>), NOT the page title.
# Leave empty to skip the itch.io push entirely; the GitHub Release still happens.
ITCH_TARGET="moechofe/lowresrmx"

# <artifact suffix>:<itch.io channel>
ITCH_CHANNELS="linux-x86_64:linux-x86_64 windows-x64:windows-x64 macos-universal:osx-universal"
