org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
# Built-in Kotlin (AGP 9 default) stays off until every plugin stops applying KGP.
# file_picker, package_info_plus, share_plus and zstandard_android still do, and
# zstandard has no newer release. Flutter's gradle plugin applies KGP itself while
# this is false, so `android/app/build.gradle` no longer applies kotlin-android.
android.builtInKotlin=false
# The new AGP 9 DSL stays off: Flutter's own gradle plugin still casts the app
# extension to the legacy AbstractAppExtension (flutter#180137) and fails to apply.
android.newDsl=false
